spring.application.name=marketplace-backend-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-key-please-1234567890abcdef}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

server.error.include-message=never
