services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - marketplace_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/marketplace?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace
      JWT_SECRET: change-this-development-secret-key-to-at-least-32-characters
    ports:
      - "8080:8080"

volumes:
  marketplace_mysql:
